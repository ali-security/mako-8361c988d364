name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector passed to tox as posargs (empty = full suite)"
        required: false
        default: ""

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"
          # no CPython 3.7 build exists for arm64 macos-latest (and building one
          # from source fails: Homebrew dropped openssl@1.1); run 3.7 on Intel macOS
          - os: "macos-latest"
            python-version: "3.7"

        include:
          - os: "macos-15-intel"
            python-version: "3.7"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        # actions/setup-python cannot provision CPython 3.7 on ubuntu-24.04 or old
        # CPython on arm64 macos-latest; this drop-in builds them when no prebuilt exists
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          pip list

      - name: Run tests
        shell: bash
        run: |
          # Pygments 2.20+ renders different HTML; three html_error_template tests in
          # test/test_exceptions.py assert the older markup (2.19.2 passes them)
          echo "pygments<2.20" > "$RUNNER_TEMP/test-constraints.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/test-constraints.txt"
          tox -- ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        env:
          # resolve build tooling (setuptools, wheel==0.38.4) as of the release date
          PIP_INDEX_URL: "https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/"
        run: |
          python -m pip install build
          # release builds clear setup.cfg's development tag (the published sdist ships tag_build empty)
          sed -i 's/^tag_build = dev$/tag_build =/' setup.cfg
          python -m build

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
